<style>
  #countup-counter .digit-col {
    width: 10px;
    height: 20px;
    overflow: hidden;
    position: relative;
  }
  #countup-counter .digit-col::before,
  #countup-counter .digit-col::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 6px;
    z-index: 2;
    pointer-events: none;
  }
  #countup-counter .digit-col::before {
    top: 0;
    background: linear-gradient(to bottom, #000000, transparent);
  }
  #countup-counter .digit-col::after {
    bottom: 0;
    background: linear-gradient(to top, #000000, transparent);
  }
  #countup-counter .digit-strip {
    position: absolute;
    left: 0; right: 0; top: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #countup-counter .digit-char {
    height: 20px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #f0ede6;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
</style>

<script>
  (function() {
    const DIGIT_H = 20;
    const ONES_STEP = 5;

    function buildStrip(el, digits) {
      digits.forEach(d => {
        const span = document.createElement('div');
        span.className = 'digit-char';
        span.textContent = d;
        el.appendChild(span);
      });
    }

    const onesDigits = [];
    for (let i = 0; i < 12; i++) [0, 5].forEach(d => onesDigits.push(d));
    const tensDigits = [];
    for (let i = 0; i < 12; i++) for (let d = 0; d <= 9; d++) tensDigits.push(d);

    buildStrip(document.getElementById('strip-h'), [0, 1]);
    buildStrip(document.getElementById('strip-t'), tensDigits);
    buildStrip(document.getElementById('strip-o'), onesDigits);

    window.addEventListener('DOMContentLoaded', function() {
      const proxy = { val: 0 };
      const stripH = document.getElementById('strip-h');
      const stripT = document.getElementById('strip-t');
      const stripO = document.getElementById('strip-o');

      gsap.set([stripH, stripT, stripO], { y: 0 });

      gsap.to(proxy, {
        val: 100,
        duration: 3,
        ease: 'power2.inOut',
        onUpdate() {
          const v = proxy.val;
          gsap.set(stripH, { y: -(v / 100) * DIGIT_H });
          gsap.set(stripT, { y: -(v / 10) * DIGIT_H });
          gsap.set(stripO, { y: -(v / ONES_STEP) * DIGIT_H });
        }
      });
    });
  })();

  function updateDateTime() {
    const now = new Date();

    const dateEl = document.querySelector(".date");
    const timeEl = document.querySelector(".time");

    if (!dateEl || !timeEl) return;

    const date = now.toLocaleDateString("en-US", {
      weekday: "short",
      month: "short",
      day: "numeric"
    });

    const time = now.toLocaleTimeString("en-US", {
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    });

    dateEl.textContent = date;
    timeEl.textContent = time;
  }

  updateDateTime();
  setInterval(updateDateTime, 60);
});

<script>
document.addEventListener("DOMContentLoaded", function () {
  if (
    typeof gsap === "undefined" ||
    typeof ScrollTrigger === "undefined" ||
    typeof SplitText === "undefined"
  ) return;

  gsap.registerPlugin(ScrollTrigger, SplitText);

  const MOBILE_BP = 768;
  const DESKTOP_BP = 992;
  const DEFAULT_OFFSET = 0.2;

  const jumpState = {
    triggerId: null,
    label: null,
    until: 0
  };

  function setJumpLock(triggerId, label, duration) {
    jumpState.triggerId = triggerId || null;
    jumpState.label = label || null;
    jumpState.until = Date.now() + (duration || 1200);
  }

  function clearJumpLockLater(delay) {
    setTimeout(function () {
      if (Date.now() >= jumpState.until) {
        jumpState.triggerId = null;
        jumpState.label = null;
        jumpState.until = 0;
      }
    }, delay || 1300);
  }

  function setNavLight(isLight) {
    if (typeof $ !== "undefined") {
      $(".logo, .nav_link").toggleClass("light", !!isLight);
    } else {
      document.querySelectorAll(".logo, .nav_link").forEach(function (el) {
        el.classList.toggle("light", !!isLight);
      });
    }
  }

  /* Blur reveal */
  gsap.utils.toArray('[data-reveal="blur"]').forEach(function (text) {
    if (
      text.matches("a") ||
      text.closest("a") ||
      text.querySelector('a[href^="#"]')
    ) {
      return;
    }

    SplitText.create(text, {
      type: "lines",
      linesClass: "about-line",
      autoSplit: true,
      onSplit(self) {
        return gsap.fromTo(
          self.lines,
          {
            opacity: 0,
            filter: "blur(10px)",
            y: 15
          },
          {
            opacity: 1,
            filter: "blur(0px)",
            y: 0,
            duration: 0.4,
            ease: "power1.out",
            stagger: 0.12,
            overwrite: true,
            scrollTrigger: {
              trigger: text,
              start: "top 75%",
              toggleActions: "play none none none",
              jumpIgnore: true
            }
          }
        );
      }
    });
  });

  /* Portfolio scroll - desktop only */
  ScrollTrigger.matchMedia({
    "(min-width: 992px)": function () {
      const section = document.querySelector(".sticky_wrap");
      const pinEl = document.querySelector(".case_wrapper");
      const items = gsap.utils.toArray(".work_item");
      const masks = gsap.utils.toArray(".slide_mask");
      const images = gsap.utils.toArray(".slide_mask img");

      if (!section || !pinEl || !items.length || !masks.length || !images.length) return;

      const HIDDEN = "polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%)";
      const FULL = "polygon(0% 0%, 100% 0%, 100% 101%, 0% 101%)";

      gsap.set(items, { opacity: 0.28 });
      gsap.set(masks, { clipPath: HIDDEN });
      gsap.set(images, { scale: 1 });

      const tl = gsap.timeline();

      tl.addLabel("s0", 0);
      tl.to(masks[0], { clipPath: FULL, duration: 1, ease: "none" }, 0);
      tl.to(images[0], { scale: 1.2, duration: 1, ease: "none" }, 0);
      tl.to(items[0], { opacity: 1, duration: 0.25, ease: "none" }, 0);

      for (let i = 1; i < items.length; i++) {
        tl.addLabel("s" + i, i);
        tl.to(masks[i], { clipPath: FULL, duration: 1, ease: "none" }, i);
        tl.to(images[i], { scale: 1.2, duration: 1, ease: "none" }, i);
        tl.to(images[i - 1], { scale: 1.4, duration: 1, ease: "none" }, i);
        tl.to(items[i - 1], { opacity: 0.28, duration: 0.25, ease: "none" }, i);
        tl.to(items[i], { opacity: 1, duration: 0.25, ease: "none" }, i);
      }

      tl.addLabel("s" + items.length, items.length);

      const labelValues = Object.values(tl.labels)
        .map(function (t) { return t / tl.duration(); })
        .sort(function (a, b) { return a - b; });

      ScrollTrigger.create({
        id: "portfolio-scroll",
        animation: tl,
        trigger: section,
        start: "top top",
        end: "+=600%",
        pin: pinEl,
        scrub: 1,
        snap: {
          snapTo(value, self) {
            const isForcedJump =
              jumpState.triggerId === "portfolio-scroll" &&
              jumpState.label &&
              Date.now() < jumpState.until;

            if (isForcedJump) {
              const forcedTime = tl.labels[jumpState.label];
              if (forcedTime !== undefined && tl.duration() > 0) {
                return forcedTime / tl.duration();
              }
            }

            const onLabel = labelValues.find(function (v) {
              return Math.abs(v - value) < 0.005;
            });

            if (onLabel !== undefined) return onLabel;

            if (self.direction === 1) {
              return (
                labelValues.find(function (v) { return v > value + 0.001; }) ||
                labelValues[labelValues.length - 1]
              );
            } else {
              return (
                labelValues.slice().reverse().find(function (v) { return v < value - 0.001; }) ||
                labelValues[0]
              );
            }
          },
          duration: { min: 0.2, max: 0.4 },
          delay: 0.05,
          ease: "power1.out"
        },
        anticipatePin: 1
      });
    }
  });

  /* Navbar color change */
  const navSections = gsap.utils.toArray(".section.dark, .section.light");

  function updateNavColorFromSections() {
    if (window.innerWidth < DESKTOP_BP) return;
    if (!navSections.length) return;

    const probeY = 2;
    let active = null;

    for (let i = 0; i < navSections.length; i++) {
      const rect = navSections[i].getBoundingClientRect();
      if (rect.top <= probeY && rect.bottom > probeY) {
        active = navSections[i];
        break;
      }
    }

    if (!active) {
      const allBelowProbe = navSections.every(function (section) {
        return section.getBoundingClientRect().top > probeY;
      });

      active = allBelowProbe
        ? navSections[0]
        : navSections[navSections.length - 1];
    }

    setNavLight(active.classList.contains("dark"));
  }

  window.updateNavColorFromSections = updateNavColorFromSections;

  ScrollTrigger.matchMedia({
    "(min-width: 992px)": function () {
      navSections.forEach(function (section) {
        ScrollTrigger.create({
          trigger: section,
          start: "top top",
          end: "bottom top",
          jumpIgnore: true,
          onEnter: updateNavColorFromSections,
          onEnterBack: updateNavColorFromSections,
          onLeave: updateNavColorFromSections,
          onLeaveBack: updateNavColorFromSections,
          onRefresh: updateNavColorFromSections
        });
      });

      requestAnimationFrame(updateNavColorFromSections);
    }
  });

  /* Jump to section / label */
  document.querySelectorAll('a[href^="#"]').forEach(function (link) {
    link.addEventListener(
      "click",
      function (e) {
        const href = this.getAttribute("href");
        if (!href || href === "#") return;

        const targetId = href.slice(1);
        const target = document.getElementById(targetId);
        if (!target) return;

        e.preventDefault();

        const isMobile = window.innerWidth < DESKTOP_BP;
        if (!isMobile) e.stopImmediatePropagation();

        const doJump = function () {
          document.documentElement.style.scrollBehavior = "auto";
          document.body.style.scrollBehavior = "auto";

          document.body.getBoundingClientRect();

          let destination;
          let st = null;

          if (typeof ScrollTrigger !== "undefined") {
            ScrollTrigger.refresh(true);

            const stId = target.dataset.scrollTriggerId;
            if (stId) {
              st = ScrollTrigger.getById(stId) || null;
            }

            if (!st) {
              const candidates = ScrollTrigger.getAll().filter(function (instance) {
                if (!instance || !instance.trigger) return false;
                if (instance.vars && instance.vars.jumpIgnore) return false;

                return (
                  target === instance.trigger ||
                  target.contains(instance.trigger) ||
                  instance.trigger.contains(target)
                );
              });

              st =
                candidates.find(function (instance) {
                  return instance.trigger === target;
                }) ||
                candidates.sort(function (a, b) {
                  const aLen = Math.abs((a.end || 0) - (a.start || 0));
                  const bLen = Math.abs((b.end || 0) - (b.start || 0));
                  return bLen - aLen;
                })[0] ||
                null;
            }
          }

          if (st) {
            const anim = st.animation;
            const namedLabel = target.dataset.scrollLabel;
            const stId = (st.vars && st.vars.id) ? st.vars.id : null;

            if (
              namedLabel &&
              anim &&
              anim.labels &&
              anim.labels[namedLabel] !== undefined &&
              typeof anim.duration === "function" &&
              anim.duration() > 0
            ) {
              const fraction = anim.labels[namedLabel] / anim.duration();

              if (stId) setJumpLock(stId, namedLabel, 1200);

              destination = st.start + (st.end - st.start) * fraction;

              if (namedLabel === "s0") {
                destination += 1;
              }
            } else {
              const pct = parseFloat(target.dataset.scrollOffset ?? DEFAULT_OFFSET);
              destination = st.start + (st.end - st.start) * pct;
            }
          } else {
            const pct = parseFloat(target.dataset.scrollOffset ?? DEFAULT_OFFSET);
            const scrollableHeight = Math.max(0, target.offsetHeight - window.innerHeight);

            destination =
              target.getBoundingClientRect().top +
              window.scrollY +
              scrollableHeight * pct;
          }

          window.scrollTo({
            top: Math.max(0, destination),
            behavior: "auto"
          });

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              document.documentElement.style.scrollBehavior = "";
              document.body.style.scrollBehavior = "";

              if (typeof ScrollTrigger !== "undefined") {
                ScrollTrigger.refresh(true);
                ScrollTrigger.update();
              }

              if (window.innerWidth >= DESKTOP_BP && window.updateNavColorFromSections) {
                window.updateNavColorFromSections();
              }

              clearJumpLockLater(1300);
            });
          });
        };

        if (isMobile) {
          setTimeout(doJump, 700);
        } else {
          doJump();
        }
      },
      true
    );
  });

  /* Global refresh */
  window.addEventListener("load", function () {
    if (window.innerWidth >= DESKTOP_BP && window.updateNavColorFromSections) {
      window.updateNavColorFromSections();
    }

    ScrollTrigger.refresh(true);
  });

  let resizeTimer;

  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(function () {
      if (window.innerWidth >= DESKTOP_BP) {
        unlockScroll();
        window.updateNavColorFromSections();
      }

      ScrollTrigger.refresh(true);
    }, 200);
  });

  /* Lock scroll when mobile menu is open — tablet and below only */
  const menuOpen = document.querySelector('.menu_button.open');
  const menuClose = document.querySelector('.menu_button.close');

  function lockScroll() {
    if (window.innerWidth < DESKTOP_BP) {
      document.body.style.overflow = 'hidden';
      document.querySelector('.navbar').style.zIndex = '9000000';
    }
  }

  function unlockScroll() {
    document.body.style.overflow = '';
    document.querySelector('.navbar').style.zIndex = '800';
  }

  if (menuOpen) {
    menuOpen.addEventListener('click', lockScroll);
  }

  if (menuClose) {
    menuClose.addEventListener('click', unlockScroll);
  }

  document.querySelectorAll('.nav_link').forEach(function (link) {
    link.addEventListener('click', unlockScroll);
  });

});
</script>

        types: 'lines',
        lineClass: 'line'
      });

      if (h1Split.lines && h1Split.lines.length) {

          opacity: 0,
          filter: 'blur(10px)',
          y: 15
        });
      }

      gsap.set('.h1', { visibility: 'visible' });
    });
  }

  function initAnimation() {
    if (animationStarted) return;
    animationStarted = true;

    requestAnimationFrame(function () {
      if (!animationPrepared) prepareAnimation();

      var lines = h1Split && h1Split.lines ? h1Split.lines : [];

      var tl = gsap.timeline();

      tl.to('.nav_menu', {
        y: 0,
        opacity: 1,
        duration: isMobile ? 0.6 : 0.3,
        ease: 'power1.out',
        clearProps: 'transform'
      }, 0);

      if (lines.length) {
        tl.to(lines, {
          opacity: 1,
          filter: 'blur(0px)',
          y: 0,
          duration: 0.6,
          ease: isMobile ? 'power3.out' : 'power1.out',
          stagger: { each: 0.10, from: 'start' }
        }, isMobile ? 0 : 0.2);
      }

      if (flexEl) {
        tl.to(flexEl, {
          scale: 1,

      tl.to('.timezone, .hero_button_wrapper', {
        y: 0,
        opacity: 1,
        duration: isMobile ? 0.5 : 0.6,
        ease: 'power1.out'
      }, isMobile ? 0 : 1);

  }

  var startDelay = loaderDelay * 1000;

  var fallback = setTimeout(function () {
    prepareAnimation();
    setTimeout(initAnimation, startDelay);
  }, 150);

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      clearTimeout(fallback);
      prepareAnimation();
      setTimeout(initAnimation, startDelay);
    }).catch(function () {
      clearTimeout(fallback);

<!-- Portfolio Swiper / Custom slider -->
<script>
(function () {
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof gsap === 'undefined') return;

    document.querySelectorAll('.swiper').forEach(function(el) {
      if (el.swiper) el.swiper.destroy(true, true);
    });

    document.querySelectorAll('.swiper-wrapper, .swiper-slide, .slides-stack').forEach(function(el) {
      el.removeAttribute('style');
    });

    var stack = document.querySelector('.slides-stack');
    if (!stack) return;

    var HIDDEN = 'polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%)';
    var FULL   = 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)';

    var slides  = gsap.utils.toArray(stack.querySelectorAll('.swiper-slide'));
    var masks   = gsap.utils.toArray(stack.querySelectorAll('.slider_mask'));
    var images  = gsap.utils.toArray(stack.querySelectorAll('.slide_img'));
    var texts   = gsap.utils.toArray(stack.querySelectorAll('.slide_content_wrap'));
    var countEl = document.querySelector('.pagination_count');
    var prevBtn = document.querySelector('.swiper-button-prev');
    var nextBtn = document.querySelector('.swiper-button-next');

    if (!masks.length || !images.length || !texts.length || !countEl || !prevBtn || !nextBtn) return;

    var current = 0;
    var total = masks.length;
    var animating = false;
    var pad = function(n) { return String(n).padStart(2, '0'); };

    gsap.set(masks,  { clipPath: HIDDEN });
    gsap.set(images, { scale: 1 });
    gsap.set(texts,  { opacity: 0 });
    gsap.set(slides, { visibility: 'hidden' });

    gsap.set(slides[0], { visibility: 'visible' });
    gsap.set(masks[0],  { clipPath: FULL });
    gsap.set(images[0], { scale: 1.2 });
    gsap.set(texts[0],  { opacity: 1 });

    countEl.textContent = pad(1);
    gsap.set(stack, { visibility: 'visible' });

    function updateCount(idx) {
      gsap.to(countEl, {
        opacity: 0,
        duration: 0.12,
        onComplete: function() {
          countEl.textContent = pad(idx + 1);
          gsap.to(countEl, { opacity: 1, duration: 0.12 });
        }
      });
    }

    function updateButtons() {
      gsap.set(prevBtn, { opacity: current <= 0 ? 0.3 : 1 });
      gsap.set(nextBtn, { opacity: current >= total - 1 ? 0.3 : 1 });
    }

    function goNext() {
      if (animating || current >= total - 1) return;

      animating = true;

      var prev = current;
      var next = current + 1;

      gsap.set(slides[next], { visibility: 'visible' });

      var tl = gsap.timeline({
        onComplete: function() {
          current = next;
          animating = false;
          gsap.set(slides[prev], { visibility: 'hidden' });
          updateButtons();
        }
      });

      tl.to(masks[next],  { clipPath: FULL, duration: 0.9, ease: 'power2.inOut' }, 0);
      tl.to(images[next], { scale: 1.2, duration: 0.9, ease: 'power2.inOut' }, 0);
      tl.to(images[prev], { scale: 1.4, duration: 0.9, ease: 'power2.inOut' }, 0);
      tl.to(texts[prev],  { opacity: 0, duration: 0.3, ease: 'power1.out' }, 0);
      tl.to(texts[next],  { opacity: 1, duration: 0.3, ease: 'power1.in' }, 0.2);

      updateCount(next);
    }

    function goPrev() {
      if (animating || current <= 0) return;

      animating = true;

      var cur = current;
      var prev = current - 1;

      gsap.set(slides[prev], { visibility: 'visible' });

      var tl = gsap.timeline({
        onComplete: function() {
          current = prev;
          animating = false;
          gsap.set(images[cur], { scale: 1 });
          gsap.set(slides[cur], { visibility: 'hidden' });
          updateButtons();
        }
      });

      tl.to(masks[cur],   { clipPath: HIDDEN, duration: 0.9, ease: 'power2.inOut' }, 0);
      tl.to(images[cur],  { scale: 1, duration: 0.9, ease: 'power2.inOut' }, 0);
      tl.to(images[prev], { scale: 1.2, duration: 0.9, ease: 'power2.inOut' }, 0);
      tl.to(texts[cur],   { opacity: 0, duration: 0.3, ease: 'power1.out' }, 0);
      tl.to(texts[prev],  { opacity: 1, duration: 0.3, ease: 'power1.in' }, 0.2);

      updateCount(prev);
    }

    updateButtons();

    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);

    var startX = 0;
    var startY = 0;
    var threshold = 50;

    stack.addEventListener('touchstart', function(e) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });

    stack.addEventListener('touchend', function(e) {
      var dx = e.changedTouches[0].clientX - startX;
      var dy = e.changedTouches[0].clientY - startY;

      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > threshold) {
        if (dx < 0) goNext();
        if (dx > 0) goPrev();
      }
    }, { passive: true });
  });
})();
</script>

<!-- Footer Morph -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (typeof gsap === 'undefined' || typeof MorphSVGPlugin === 'undefined') return;

  gsap.registerPlugin(MorphSVGPlugin);

  const CENTER_X = 796;
  const CENTER_Y = 138;

  function buildTimeline() {
    const tl = gsap.timeline({
      onComplete: function () {
        gsap.set('#shape1', {
          rotation: 0,
          svgOrigin: CENTER_X + ' ' + CENTER_Y
        });

        buildTimeline();
      }
    });

    const step = function (shape, rotation) {
      return {
        duration: 1,
        morphSVG: { shape: shape, shapeIndex: 'auto' },
        rotation: rotation,
        svgOrigin: CENTER_X + ' ' + CENTER_Y,
        ease: 'power2.inOut'
      };
    };

    tl.to('#shape1', step('#shape2', 60))
      .to('#shape1', step('#shape3', 120))
      .to('#shape1', step('#shape4', 180))
      .to('#shape1', step('#shape5', 240))
      .to('#shape1', step('#shape6', 300))
      .to('#shape1', step('#shape7', 360))
      .to('#shape1', step('#shape1', 450));

    return tl;
  }

  if (document.querySelector('#shape1')) {
    buildTimeline();
  }
});
</script>

<script>
function updatePolandTime() {
  const now = new Date();

  const time = now.toLocaleTimeString('en-GB', {
    timeZone: 'Asia/Kolkata',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  });

  const formatter = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Kolkata',
    timeZoneName: 'shortOffset',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  });

  const parts = formatter.formatToParts(now);
  const tzPart = parts.find(function (part) {
    return part.type === 'timeZoneName';
  });

  const gmt = tzPart ? tzPart.value.replace('UTC', 'GMT') : 'GMT+5:30';
  const content = 'local time<br>' + time + ' (' + gmt + ')';

  const el1 = document.getElementById('local-time');
  const el2 = document.getElementById('timezone');
  const el3 = document.getElementById('nav_time');

  if (el1) el1.innerHTML = content;
  if (el2) el2.innerHTML = content;
  if (el3) el3.innerHTML = content;
}

updatePolandTime();
setInterval(updatePolandTime, 1000);
</script>

name = "boatship-onboarding"
main = "custom-worker.ts"
compatibility_date = "2026-09-13"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 0.1

[[durable_objects.bindings]]
name = "MESSAGE_ROOM"
class_name = "MessageRoom"

[[durable_objects.bindings]]
name = "APP_RUNTIME"
class_name = "AppRuntime"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MessageRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AppRuntime"]

# Hyperdrive is supported by lib/prisma.ts, but a binding must only be enabled
# after creating the real resource. Never commit a placeholder ID.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<set-your-real-hyperdrive-id>"

[[routes]]
pattern = "boatship.cohortix.in"
custom_domain = true

name = "boatship-onboarding"
main = "custom-worker.ts"
compatibility_date = "2026-09-13"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 0.1

[triggers]
# Queue drains start after each enqueue; the hourly run only retries interrupted work.
crons = ["30 3 * * 1-5", "0 * * * *"]

[[durable_objects.bindings]]
name = "MESSAGE_ROOM"
class_name = "MessageRoom"

[[durable_objects.bindings]]
name = "APP_RUNTIME"
class_name = "AppRuntime"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MessageRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AppRuntime"]

# Document bytes. Create the bucket before deploying:
#   wrangler r2 bucket create boatship-documents
[[r2_buckets]]
binding = "DOCUMENT_FILES"
bucket_name = "boatship-documents"

[[routes]]
pattern = "boatship.cohortix.in"
custom_domain = true
